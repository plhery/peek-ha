[project]
name = "peek-home-assistant"
version = "0.1.2"
description = "Peek's parcels in Home Assistant"
license = "Apache-2.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pytest_asyncio.*"]

[tool.coverage.run]
source = ["custom_components.peek"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP", "W"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["custom_components"]
known-third-party = ["pytest_homeassistant_custom_component"]
section-order = ["future", "standard-library", "third-party", "homeassistant", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
homeassistant = ["homeassistant"]
